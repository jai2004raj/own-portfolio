<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b0f19" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#primaryGradient)" stroke-width="3" opacity="0.8" />
  <g filter="url(#glow)">
    <text x="50" y="62" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="42" font-weight="900" fill="url(#primaryGradient)" text-anchor="middle" letter-spacing="-1">JA</text>
  </g>
  <circle cx="80" cy="24" r="5" fill="#10b981" />
</svg>
